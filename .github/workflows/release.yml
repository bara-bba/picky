name: Release

# Triggered by the tags you already use (v0.1.0, v0.2.0, v0.3.0 ...).
# Builds, smoke-tests, then packs a Velopack installer and attaches it to a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Single source of truth for the version: the tag. Stops the csproj drifting from the
      # tag the way 0.2.0 nearly did.
      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $v"

      - name: Build
        run: dotnet build src/Picky/Picky.csproj -c Release

      - name: Smoke test (--probe diagnostic)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'probe'
          & 'src/Picky/bin/Release/net8.0-windows10.0.19041.0/Picky.exe' --probe $out
          for ($i = 0; $i -lt 30 -and -not (Test-Path (Join-Path $out 'monitors.txt')); $i++) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path (Join-Path $out 'monitors.txt'))) { throw 'probe produced no monitors.txt' }
          Get-Content (Join-Path $out 'monitors.txt') | Select-Object -First 20

      # Framework-dependent: ~30 MB instead of ~280 MB self-contained. The .NET 8 Desktop Runtime
      # is a prerequisite, which Velopack installs on first run via --framework below. ffmpeg is no
      # longer bundled either (runtime prerequisite: winget install ffmpeg) — recording and video
      # thumbnails degrade gracefully without it; screenshots are unaffected.
      - name: Publish
        run: >
          dotnet publish src/Picky/Picky.csproj -c Release -r win-x64 --self-contained false
          -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      # Pulls previous releases so `vpk pack` can compute a delta against them. Expected to
      # fail on the very first release (nothing to diff against), hence continue-on-error.
      - name: Download previous releases (for delta generation)
        continue-on-error: true
        run: >
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        run: >
          vpk pack --packId Picky --packTitle picky
          --packAuthors "${{ github.repository_owner }}"
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish --mainExe Picky.exe
          --icon src/Picky/app.ico
          --framework net8.0-x64-desktop

      - name: Show artefacts
        shell: pwsh
        run: Get-ChildItem Releases | ForEach-Object { '{0,-44} {1,9:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - name: Publish GitHub Release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --releaseName "Picky ${{ steps.ver.outputs.version }}"
          --publish

      - name: Upload artefacts to the workflow run as well
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picky-installer-${{ steps.ver.outputs.version }}
          path: Releases
          if-no-files-found: warn
